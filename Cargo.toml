[package]
name = "fasthtmlparser"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
description = "Fast HTML / XML parser for scraping with XPath 1.0 and CSS selectors: a flat tag list, lazy text and attributes. A port of z3l.FastHtmlParser."
license-file = "LICENSE.md"
repository = "https://github.com/romanti3172/fasthtmlparser-rs"
documentation = "https://docs.rs/fasthtmlparser"
readme = "README.md"
keywords = ["html", "parser", "xpath", "css", "scraping"]
categories = ["parser-implementations", "web-programming"]
exclude = ["testdata/", "tools/", "bench/", ".github/"]

[dependencies]
memchr = "2.7"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
